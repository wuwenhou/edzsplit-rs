name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Selftest (end-to-end)
        run: cargo run --locked --release -- selftest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: edzsplit-${{ github.ref_name }}-x86_64-unknown-linux
            target: x86_64-unknown-linux-musl
            bin: target/x86_64-unknown-linux-musl/release/edzsplit
          - os: windows-latest
            asset: edzsplit-${{ github.ref_name }}-x86_64-pc-windows.exe
            bin: target/release/edzsplit.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build static Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --locked --release

      - name: Package assets
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          cat "dist/${{ matrix.asset }}.sha256"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
